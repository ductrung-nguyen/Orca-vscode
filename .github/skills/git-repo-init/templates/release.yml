# Semantic Release Workflow
# Generated by git-repo-init skill
#
# Triggers on pushes to main, beta, and alpha branches.
# Creates releases and generates changelogs based on conventional commits.
#
# Required permissions:
# - GITHUB_TOKEN: Automatically provided, needs write permissions for releases
# - NPM_TOKEN: Optional, only if publishing to npm

name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    # Only run if commit message doesn't start with 'chore(release)'
    # This prevents infinite loops from release commits
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"

    permissions:
      contents: write        # Create releases and tags
      issues: write          # Comment on issues
      pull-requests: write   # Comment on PRs

    steps:
      # Step 1: Checkout with full history (required for changelog generation)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 2: Setup Node.js (semantic-release requires Node)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run semantic-release
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}  # Uncomment if publishing to npm
        run: npx semantic-release

# Notes:
# ------
# 1. This workflow requires semantic-release to be installed as a dev dependency:
#    npm install --save-dev semantic-release @semantic-release/github
#
# 2. The .releaserc.json file must be configured with branch settings.
#
# 3. Branch strategy:
#    - main: Stable releases (v1.0.0, v1.1.0, etc.)
#    - beta: Beta prereleases (v1.0.0-beta.1, etc.)
#    - alpha: Alpha prereleases (v1.0.0-alpha.1, etc.)
#
# 4. Conventional commit types that trigger releases:
#    - feat: Minor version bump (1.x.0)
#    - fix: Patch version bump (1.0.x)
#    - perf: Patch version bump
#    - BREAKING CHANGE: Major version bump (x.0.0)
#
# 5. For private repos, ensure GITHUB_TOKEN has sufficient permissions.
